apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: corewebforms
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: frontend
          image: corewebforms-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: Urls
              value: http://0.0.0.0:8081
            - name: Database__Migrate
              value: "false"
            - name: Session__Redis
              valueFrom: { configMapKeyRef: { name: corewebforms-config, key: session-redis } }
            - name: Services__Products__BaseUrl
              valueFrom: { configMapKeyRef: { name: corewebforms-config, key: products-baseurl } }
            - name: Services__Orders__BaseUrl
              valueFrom: { configMapKeyRef: { name: corewebforms-config, key: orders-baseurl } }
            - name: Http__PooledConnectionLifetimeSeconds
              valueFrom: { configMapKeyRef: { name: corewebforms-config, key: pooled-lifetime } }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
          ports:
            - containerPort: 8081
          # Sized off Phase 3's measured ~23s cold ASPX compile, with margin
          # for CPU-limit stretch. Undersized startup probes produce
          # CrashLoopBackOff that reads like an application fault.
          startupProbe:
            httpGet: { path: /health/live, port: 8081 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 8081 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 8081 }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: corewebforms
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - port: 8081
      targetPort: 8081
