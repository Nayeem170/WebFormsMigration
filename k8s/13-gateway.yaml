apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: corewebforms
data:
  appsettings.Production.json: |
    {
      "ReverseProxy": {
        "Clusters": {
          "frontend": {
            "LoadBalancingPolicy": "RoundRobin",
            "HealthCheck": {
              "AvailableDestinationsPolicy": "HealthyAndUnknown",
              "Active": {
                "Enabled": true,
                "Interval": "00:00:02",
                "Timeout": "00:00:02",
                "Policy": "ConsecutiveFailures",
                "Path": "/health/ready"
              },
              "Passive": {
                "Enabled": true
              }
            },
            "Destinations": {
              "frontend": {
                "Address": "http://frontend:8081/"
              }
            }
          }
        },
        "Routes": {
          "frontend": {
            "ClusterId": "frontend",
            "Order": 1,
            "Match": {
              "Path": "{**catch-all}"
            }
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: corewebforms
  labels: { app: gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: gateway
          image: corewebforms-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: Urls
              value: http://0.0.0.0:8080
            # TLS termination + management port.
            # Kestrel ignores Urls once Kestrel__Endpoints__ entries exist.
            - name: Kestrel__Endpoints__Http__Url
              value: http://0.0.0.0:8080
            - name: Kestrel__Endpoints__Https__Url
              value: https://0.0.0.0:8443
            - name: Kestrel__Endpoints__Https__Certificate__Path
              value: /certs/gateway.pfx
            - name: Kestrel__Endpoints__Https__Certificate__Password
              valueFrom: { secretKeyRef: { name: gateway-tls, key: password } }
            - name: Kestrel__Endpoints__Management__Url
              value: http://0.0.0.0:8090
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
          volumeMounts:
            - name: config
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
          ports:
            - containerPort: 8080
            - containerPort: 8443
            - containerPort: 8090
          # Probes hit the MANAGEMENT port: /health is unroutable from the
          # public port by design (recon oracle).
          startupProbe:
            httpGet: { path: /health/live, port: 8090 }
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /health/live, port: 8090 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 8090 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: gateway-config }
        - name: certs
          secret: { secretName: gateway-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: corewebforms
spec:
  type: ClusterIP
  selector: { app: gateway }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
