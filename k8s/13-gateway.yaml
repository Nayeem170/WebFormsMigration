apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: corewebforms
data:
  appsettings.Production.json: |
    {
      "ReverseProxy": {
        "Clusters": {
          "frontend": {
            "LoadBalancingPolicy": "RoundRobin",
            "HealthCheck": {
              "AvailableDestinationsPolicy": "HealthyAndUnknown",
              "Active": {
                "Enabled": true,
                "Interval": "00:00:02",
                "Timeout": "00:00:02",
                "Policy": "ConsecutiveFailures",
                "Path": "/health/ready"
              },
              "Passive": {
                "Enabled": true
              }
            },
            "Destinations": {
              "frontend": {
                "Address": "http://frontend:8081/"
              }
            }
          }
        },
        "Routes": {
          "frontend": {
            "ClusterId": "frontend",
            "Order": 1,
            "Match": {
              "Path": "{**catch-all}"
            }
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: corewebforms
  labels: { app: gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: gateway
          image: corewebforms-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: Urls
              value: http://0.0.0.0:8080
          volumeMounts:
            - name: config
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
              readOnly: true
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: gateway-config }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: corewebforms
spec:
  type: ClusterIP
  selector: { app: gateway }
  ports:
    - port: 8080
      targetPort: 8080
