name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-tier:
    # Fast gate: compile + in-process unit tests, then the full compose
    # stack with every out-of-process suite that proves it. All creds are
    # committed localdev values by design (demo project).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: docker/setup-buildx-action@v3

      - name: Build catalog image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Microservices/Catalog/Dockerfile
          tags: corewebforms-catalog:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build orders image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Microservices/Orders/Dockerfile
          tags: corewebforms-orders:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Microservices/Frontend/Dockerfile
          tags: corewebforms-frontend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Microservices/Gateway/Dockerfile
          tags: corewebforms-gateway:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build solution
        run: dotnet build Microservices/Microservices.slnx --configuration Release --nologo

      - name: Unit tier (in-process, no stack)
        run: dotnet test Microservices/Microservices.slnx --no-build --configuration Release --filter "FullyQualifiedName~UnitTests"

      - name: Generate gateway dev cert
        run: pwsh infra/make-cert.ps1

      - name: Start stack (base + test-ports overlay)
        run: docker compose -f compose.yaml -f compose.test-ports.yaml up -d --wait --wait-timeout 900

      - name: Characterization tests (direct to replicas)
        env:
          CATALOG_BASE: http://127.0.0.1:18094
          ORDERS_BASE: http://127.0.0.1:18095
        run: dotnet test Microservices/Microservices.slnx --no-build --configuration Release --filter "FullyQualifiedName~CharacterizationTests"

      - name: Smoke parity (gateway ingress + replicas)
        run: pwsh scripts/smoke-parity.ps1 -BaseUrl http://127.0.0.1:8080 -CatalogUrl http://127.0.0.1:18094 -OrdersUrl http://127.0.0.1:18095

      - name: Failure-injection suite (compose topology)
        run: pwsh scripts/test-failures.ps1 -Topology compose

      - name: Exposure check (every published port loopback)
        run: pwsh scripts/check-exposure.ps1
