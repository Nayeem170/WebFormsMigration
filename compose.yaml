name: corewebforms

services:
  postgres:
    # ECR public mirror of the Docker Hub library image: GH-hosted runners
    # share a Docker Hub IP pool and hit unauthenticated pull limits - the
    # classic nightly flake. Mirror is public, no auth. Digest-pinned: a
    # floating tag re-resolves the manifest (cache-miss 429 passthrough
    # observed once); a pinned digest is served from ECR's warmed cache.
    image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: ccw_catalog
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ccw_catalog"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  redis:
    # Digest-pinned for the same reason as postgres above.
    image: public.ecr.aws/docker/library/redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  catalog-migrator:
    build:
      context: .
      dockerfile: Microservices/Catalog/Dockerfile
    command: ["dotnet", "Catalog.dll", "--migrate"]
    environment:
      Database__Provider: postgres
      Database__ConnectionString: Host=postgres;Port=5432;Database=ccw_catalog;Username=ccw_migrator;Password=localdev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  orders-migrator:
    build:
      context: .
      dockerfile: Microservices/Orders/Dockerfile
    command: ["dotnet", "Orders.dll", "--migrate"]
    environment:
      Database__Provider: postgres
      Database__ConnectionString: Host=postgres;Port=5432;Database=ccw_orders;Username=ccw_migrator;Password=localdev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  catalog: &catalog-service
    build:
      context: .
      dockerfile: Microservices/Catalog/Dockerfile
    environment: &catalog-env
      Urls: http://0.0.0.0:8094
      Database__Provider: postgres
      # MaxPoolSize=20: admission control per process (bounds concurrent
      # transactions queuing on a row). max_connections=200 leaves a budget
      # of 180 for apps; the k8s Phase 6 arithmetic is recorded in the plan:
      # (4 catalog + 4 orders HPA max) x 20 = 160 <= 180.
      Database__ConnectionString: Host=postgres;Port=5432;Database=ccw_catalog;Username=ccw_app;Password=localdev;MaxPoolSize=20
      Database__Migrate: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      catalog-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8094/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  catalog2:
    <<: *catalog-service

  orders: &orders-service
    build:
      context: .
      dockerfile: Microservices/Orders/Dockerfile
    environment: &orders-env
      <<: *catalog-env
      Urls: http://0.0.0.0:8095
      Database__ConnectionString: Host=postgres;Port=5432;Database=ccw_orders;Username=ccw_app;Password=localdev;MaxPoolSize=20
      Services__Catalog__BaseUrl: http://catalog:8094,http://catalog2:8094
    depends_on:
      postgres:
        condition: service_healthy
      orders-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8095/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  orders2:
    <<: *orders-service

  frontend: &frontend-service
    build:
      context: .
      dockerfile: Microservices/Frontend/Dockerfile
    environment: &frontend-env
      Urls: http://0.0.0.0:8081
      Database__Migrate: "false"
      Session__Redis: redis:6379
      Services__Products__BaseUrl: http://catalog:8094,http://catalog2:8094
      Services__Orders__BaseUrl: http://orders:8095,http://orders2:8095
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      redis:
        condition: service_healthy
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Generous on purpose: 4-vCPU CI runners boot all 10 services at once
      # and the cold window is long. Raise the grace, never loosen the check.
      start_period: 60s

  frontend2:
    <<: *frontend-service

  # Telemetry sink for the whole compose topology. Debug exporter to
  # stdout: the observability controls assert on `docker compose logs
  # otel-collector`. ADOT distro image (ECR public, digest-pinned like
  # postgres/redis - no Docker Hub dependency).
  otel-collector:
    image: public.ecr.aws/aws-observability/aws-otel-collector:v0.43.1@sha256:db725ac7007ef1d9b5a357a59f3b964ab9e1df23ebb0dfc694275019048b489b
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otel-collector.yaml:ro

  gateway:
    build:
      context: .
      dockerfile: Microservices/Gateway/Dockerfile
    environment:
      Urls: http://0.0.0.0:8080
      # TLS termination + management port. Kestrel ignores Urls once any
      # Kestrel__Endpoints__ entry exists, so the main listener is declared
      # explicitly too.
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Https__Url: https://0.0.0.0:8443
      Kestrel__Endpoints__Https__Certificate__Path: /certs/gateway.pfx
      Kestrel__Endpoints__Https__Certificate__Password: ${GATEWAY_CERT_PASSWORD:-localdev-cert}
      Kestrel__Endpoints__Management__Url: http://0.0.0.0:8090
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ./infra/certs:/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      frontend2:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
